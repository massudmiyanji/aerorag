# Local infrastructure. Ollama runs natively on macOS (no GPU in Docker on a Mac),
# so containers reach it at host.docker.internal:11434.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333" # REST API and dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
